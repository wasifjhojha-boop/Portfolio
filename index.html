<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-FOUC: set the theme before first paint. Runs synchronously,
         blocking render for a fraction of a millisecond — cheaper than a
         flash of the wrong theme. -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo/mw-mark-light-bg.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Mohd Wasif | Full-Stack Web Developer</title>
    <meta name="title" content="Mohd Wasif | Full-Stack Web Developer" />
    <meta name="description" content="Full-stack web developer building fast, accessible React, Next.js, and WordPress sites — with technical SEO and performance marketing built in." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.wasif.world/" />
    <meta property="og:site_name" content="Mohd Wasif" />
    <meta property="og:title" content="Mohd Wasif | Full-Stack Web Developer" />
    <meta property="og:description" content="Full-stack web developer building fast, accessible React, Next.js, and WordPress sites — with technical SEO and performance marketing built in." />
    <!-- Social crawlers require absolute URLs; relative paths are ignored. -->
    <meta property="og:image" content="https://www.wasif.world/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mohd Wasif — Performance Marketing, SEO, Web Development" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.wasif.world/" />
    <meta property="twitter:title" content="Mohd Wasif | Full-Stack Web Developer" />
    <meta property="twitter:description" content="Full-stack web developer building fast, accessible React, Next.js, and WordPress sites — with technical SEO and performance marketing built in." />
    <meta property="twitter:image" content="https://www.wasif.world/og-cover.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
